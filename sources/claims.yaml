# Relationships from sources other than the SEC filings the pipeline reads.
#
# Rules (README, "Sources"):
#   * Every claim quotes the source word for word. `hscm verify-web` fetches each
#     URL and checks the quote is on the page; SEC quotes are also checked
#     against the cached filings at build time.
#   * `type` says how strong the source is: sec_filing > company > press.
#     press = a major news outlet reporting it. `confirmed: false` marks a deal
#     the companies themselves have not announced.
#   * `what` is a short plain-English label. It may only restate the quote.
#   * Direction: `supplier` provides the thing to `buyer`. For `invests_in`
#     and `finances`, the supplier is the one putting in money.
#
# relationship: supplies | manufactures_for | leases_capacity_to | invests_in |
#               finances | partners_with (no direction stated) | acquires

claims:


[project]
name = "hscm"
version = "0.1.0"
description = "Evidence-backed supply chain graph of the AI hyperscalers, built from SEC EDGAR filings"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
anthropic = ["anthropic>=0.60"]
neo4j = ["neo4j>=5.20"]

[project.scripts]
hscm = "hscm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hscm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Turn an implicit text encoding into a test failure. Reading or writing a file
# without saying "utf-8" uses whatever the platform prefers — UTF-8 on Linux,
# cp1252 on Windows — so a filing containing a non-breaking hyphen writes fine
# on one machine and raises UnicodeEncodeError on another. This is the only
# check that catches it without a Windows machine to run on. Requires
# PYTHONWARNDEFAULTENCODING=1, which the Makefile and run.ps1 both set.
filterwarnings = ["error::EncodingWarning"]

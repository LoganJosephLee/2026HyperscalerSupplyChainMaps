# Entity resolution decisions, made by hand and reviewed in version control.
# aliases:    raw filing name -> the CIK it refers to
# non_filers: raw filing name -> note. Named in a filing, files nothing
#             itself, so it is a node with no CIK. Use
#             {canonical: <name>, note: <text>} to fold a spelling
#             variant onto an existing non-filer node.
# excluded:   raw filing name -> why it is not in the dataset at all
# Regenerate the queue with `hscm review build`; apply it with `hscm review apply`.
#
# `hscm review apply` REWRITES this file. Entries and their notes survive;
# comments you add by hand between them do not. Put the reasoning for a
# decision in that entry's note, where it is data and will be kept.
aliases: {}
non_filers:
  OpenAI: Private company. Named in Microsoft's 10-K; files nothing with the SEC, so it is a node with
    no CIK and nothing it says can corroborate the edge.
  SK Hynix: Korean-listed, so it files nothing with the SEC — but NVIDIA's 10-K names it outright, and
    a citable sentence is the test this project applies. Excluded under the original scope decision, before
    non-filer nodes existed; once they did, "cited but files nothing" was already a category and this
    belongs in it. Nothing it says can corroborate or contradict an edge.
  SK Hynix Inc.:
    canonical: SK Hynix
    note: As spelled in NVIDIA's 10-K.
  SK hynix Inc.:
    canonical: SK Hynix
    note: The company's own lower-case styling.
  Samsung:
    canonical: Samsung Electronics
    note: Short form used later in the same NVIDIA 10-K.
  Samsung Electronics: Korean-listed, so it files nothing with the SEC — but NVIDIA's 10-K names it outright.
    Same reasoning as SK Hynix. Keeping both out is what forced Micron to stand in for the whole memory
    supply, which the limitations page had to apologise for.
  Samsung Electronics Co., Ltd.:
    canonical: Samsung Electronics
    note: Full legal name as NVIDIA's 10-K first spells it.
excluded: {}
